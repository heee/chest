<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Chess Coach</title>
<meta name="description" content="Chess for two on one iPad, with a picture coach that teaches the moves.">
<meta name="theme-color" content="#ECE8E2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Chess">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="preload" href="fonts/outfit-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<svg aria-hidden="true" width="0" height="0" style="position: absolute">
  <defs>
    <!-- White marble: lit from the top left. -->
    <radialGradient id="marbleW" cx="0.35" cy="0.25" r="0.9">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.45" stop-color="#F3EFE8"/>
      <stop offset="0.8" stop-color="#D9D1C4"/>
      <stop offset="1" stop-color="#B9AF9F"/>
    </radialGradient>
    <!-- Black marble, upright (used in the coach diagram). -->
    <radialGradient id="marbleB" cx="0.35" cy="0.25" r="0.9">
      <stop offset="0" stop-color="#7A8088"/>
      <stop offset="0.35" stop-color="#3A3F46"/>
      <stop offset="0.8" stop-color="#16191D"/>
      <stop offset="1" stop-color="#0A0B0D"/>
    </radialGradient>
    <!-- Black marble for pieces drawn upside down on the board: the highlight is placed so that,
         once the piece is turned 180 degrees, the light still falls from the top left of the room. -->
    <radialGradient id="marbleBR" cx="0.65" cy="0.75" r="0.9">
      <stop offset="0" stop-color="#7A8088"/>
      <stop offset="0.35" stop-color="#3A3F46"/>
      <stop offset="0.8" stop-color="#16191D"/>
      <stop offset="1" stop-color="#0A0B0D"/>
    </radialGradient>
  </defs>
</svg>

<main id="stage" class="stage">
  <div class="board-frame">
    <div id="board" class="board" role="grid" aria-label="Chess board"></div>
  </div>

  <div id="paneTurn" class="pane-turn">
    <section id="pane" class="pane" aria-live="polite">
      <header class="pane-head">
        <span id="turnDot" class="turn-dot" aria-hidden="true"></span>
        <div class="pane-head-text">
          <button type="button" id="nameBtn" class="name-btn" aria-label="Change player names">
            <h1 id="turnTitle"></h1>
            <svg class="pencil" aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
          </button>
          <p id="turnSub" class="turn-sub"></p>
        </div>
      </header>

      <div id="paneBody" class="pane-body"></div>

      <div class="controls">
        <button type="button" id="btnHint" class="btn primary">Show a hint</button>
        <button type="button" id="btnUndo" class="btn">Undo move</button>
        <button type="button" id="btnLessons" class="btn">Lessons</button>
        <button type="button" id="btnRestart" class="btn">Start over</button>
      </div>
    </section>
  </div>
</main>

<script src="js/engine.js"></script>
<script src="js/pieces.js"></script>
<script src="js/app.js"></script>
</body>
</html>
